name: Build & Publish Documentation

on:
  push:
    branches: [main]
    paths:
      - 'Codigo/**'
      - 'STM32*/Core/Inc/config.h'
      - 'arduino_gs_software/**'
      - 'Dashboard Python/**'
      - 'Documentation/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /R-D_Software_Magalhaes_V2
    defaults:
      run:
        working-directory: Documentation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Documentation/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Nextra site (static export)
        run: npm run build

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Fetch Doxygen Awesome theme
        run: bash scripts/fetch-docs-deps.sh

      - name: Build Doxygen API reference
        run: doxygen Doxyfile

      - name: Embed Doxygen output as /api/
        run: |
          mkdir -p out/api
          cp -r docs/html/* out/api/

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
